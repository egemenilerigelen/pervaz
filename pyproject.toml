[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pervaz"
dynamic = ["version"]
description = "Ekranın kenarından açılan, kartlardan oluşan modüler Windows paneli"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["windows", "pyside6", "desktop-panel", "widget"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
authors = [{ name = "Egemenilrgln", email = "egeilrgln@gmail.com" }]
dependencies = [
    "PySide6-Essentials>=6.7",
    "requests>=2.31",
    # Telemetri kartı: işlemci, bellek, ağ, disk (psutil) ve NVIDIA ekran kartı (NVML).
    "psutil>=5.9",
    "nvidia-ml-py>=12",
    # Spotify kartı: Windows medya oturumu (WinRT) ve ses karıştırıcı (pycaw).
    "pycaw>=20260927",
    "winrt-runtime",
    "winrt-Windows.Foundation",
    "winrt-Windows.Foundation.Collections",
    "winrt-Windows.Media",
    "winrt-Windows.Media.Control",
    "winrt-Windows.Storage.Streams",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "pyinstaller>=6.6",
    "pillow>=10",  # yalnızca tools/make_icon.py için
]

[project.urls]
Homepage = "https://github.com/egemenilerigelen/pervaz"
Documentation = "https://github.com/egemenilerigelen/pervaz/tree/main/docs"
Issues = "https://github.com/egemenilerigelen/pervaz/issues"

[project.gui-scripts]
pervaz = "pervaz.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "pervaz.__version__" }

[tool.setuptools.package-data]
pervaz = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Arayüz metinleri Türkçe; "ı", "ş" gibi karakterler bilinçli kullanılıyor.
ignore = ["RUF001", "RUF002", "RUF003"]
